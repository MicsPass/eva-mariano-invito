<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#BA0024">
  <meta name="description" content="Eva & Mariano: un matrimonio, un compleanno, un nuovo anno. Tre motivi. Una sola notte.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Eva & Mariano · Tre motivi. Una sola notte.">
  <meta property="og:description" content="31 dicembre 2026 · Apri l'invito interattivo.">
  <meta property="og:image" content="https://micspass.github.io/eva-mariano-invito/origami/assets/01-copertina.svg">
  <title>Eva & Mariano — Invito origami</title>
  <style>
    :root { color-scheme: light; --red: #b90025; --gold:#cb7f32; --cream:#fffaf4; --dark:#241b1d; --foldtime: 1130ms; }
    *,*::before,*::after { box-sizing:border-box; }
    html { background:var(--red); }
    body { margin:0; min-height:100vh; min-height:100dvh; color:white; font-family:Arial, Helvetica, sans-serif; background:radial-gradient(ellipse at 52% 33%,#cb1836 0%,#b60026 52%,#97001e 100%); }
    .app { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; padding:12px 12px max(12px, env(safe-area-inset-bottom)); gap:12px; }
    .topbar { display:flex; justify-content:space-between; gap:24px; align-items:center; width:min(calc(100vw - 24px), 475px); min-height:24px; text-transform:uppercase; font-size:11px; font-weight:700; letter-spacing:.13em; color:#fff0d9; }
    .topbar .tag { display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
    .topbar .tag:before { content:""; width:6px; height:6px; background:var(--gold); border-radius:50%; }
    .viewer { width:min(calc(100vw - 24px), calc((100dvh - 155px)*.5625), 475px); min-width:180px; aspect-ratio:9/16; position:relative; perspective:1900px; transform-style:preserve-3d; isolation:isolate; }
    .sheet { position:absolute; inset:0; background:#fff center / 100% 100% no-repeat; box-shadow:0 16px 38px #3b000d80, 0 0 0 1px #ffffff40; overflow:hidden; }
    .sheet:after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 35px #3b000d08; pointer-events:none; }
    .layer { position:absolute; inset:0; z-index:4; transform-style:preserve-3d; pointer-events:none; }
    .flap { position:absolute; background-repeat:no-repeat; backface-visibility:hidden; transform-style:preserve-3d; will-change:transform,opacity; box-shadow:inset 0 0 1px #0003; }
    .flap::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(100deg,#0002,transparent 36%,#fff3 72%,#0001); opacity:0; }
    .flap.moving::after { animation:creaseLight var(--foldtime) ease-in-out both; }
    @keyframes creaseLight { 0%{opacity:0} 18%{opacity:.55} 58%{opacity:.9} 100%{opacity:0} }
    /* Side-hinged doors: the first scene opens like a folded invitation. */
    .gate-left,.gate-right { top:0; height:100%; width:50%; background-size:200% 100%; }
    .gate-left { left:0; background-position:left top; transform-origin:left center; }
    .gate-right { right:0; background-position:right top; transform-origin:right center; }
    .gate-left.moving { animation:openLeft var(--foldtime) cubic-bezier(.56,.08,.22,1) forwards; }
    .gate-right.moving { animation:openRight var(--foldtime) cubic-bezier(.56,.08,.22,1) forwards; }
    @keyframes openLeft { 0%,8% {transform:rotateY(0deg);opacity:1} 52%{opacity:1} 78%{opacity:.96} 100%{transform:rotateY(-105deg);opacity:0} }
    @keyframes openRight { 0%,8% {transform:rotateY(0deg);opacity:1} 52%{opacity:1} 78%{opacity:.96} 100%{transform:rotateY(105deg);opacity:0} }
    /* Top and bottom folds. */
    .fold-top,.fold-bottom { left:0; width:100%; height:50%; background-size:100% 200%; }
    .fold-top { top:0; background-position:top left; transform-origin:center top; }
    .fold-bottom { bottom:0; background-position:bottom left; transform-origin:center bottom; }
    .fold-top.moving {animation:openUp var(--foldtime) cubic-bezier(.6,.07,.2,1) forwards}
    .fold-bottom.moving {animation:openDown var(--foldtime) cubic-bezier(.6,.07,.2,1) forwards}
    @keyframes openUp {0%,9%{transform:rotateX(0);opacity:1}55%{opacity:1}100%{transform:rotateX(105deg);opacity:0}}
    @keyframes openDown {0%,9%{transform:rotateX(0);opacity:1}55%{opacity:1}100%{transform:rotateX(-105deg);opacity:0}}
    /* Four triangular petals meet at the center. */
    .petal { inset:0; background-size:100% 100%; }
    .petal-top { clip-path:polygon(0 0,100% 0,50% 50%); transform-origin:50% 0%; }
    .petal-right { clip-path:polygon(100% 0,100% 100%,50% 50%);transform-origin:100% 50%; }
    .petal-bottom { clip-path:polygon(0 100%,100% 100%,50% 50%);transform-origin:50% 100%; }
    .petal-left { clip-path:polygon(0 0,0 100%,50% 50%);transform-origin:0 50%; }
    .petal-top.moving {animation:openUp var(--foldtime) ease-in-out forwards}
    .petal-right.moving {animation:openRight var(--foldtime) ease-in-out forwards}
    .petal-bottom.moving {animation:openDown var(--foldtime) ease-in-out forwards}
    .petal-left.moving {animation:openLeft var(--foldtime) ease-in-out forwards}
    /* Four accordion strips, staged to open in a wave. */
    .strip { top:0; height:100%; width:25%; background-size:400% 100%; transform-origin:left center; }
    .strip:nth-child(1) { left:0%; background-position:0% 0%; }
    .strip:nth-child(2) { left:25%; background-position:33.333% 0%; }
    .strip:nth-child(3) { left:50%; background-position:66.666% 0%; }
    .strip:nth-child(4) { left:75%; background-position:100% 0%; }
    .strip.moving {animation:accordion var(--foldtime) ease-in-out both;animation-delay:calc(var(--n)*85ms)}
    @keyframes accordion {0%,12%{transform:rotateY(0);opacity:1}54%{opacity:1}100%{transform:rotateY(-105deg);opacity:0}}
    .seam {z-index:6; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 180ms; }
    .is-animating .seam {opacity:.18}
    .seam:before, .seam:after {content:"";position:absolute;background:#44200c;box-shadow:1px 0 4px #fff7}
    .seam:before {width:1px; height:100%;left:50%;top:0}
    .seam:after {height:1px;width:100%;top:50%;left:0}
    .controls {width:min(calc(100vw - 24px),475px);display:flex;align-items:center;gap:10px;justify-content:space-between;}
    button {cursor:pointer;font:inherit;min-height:43px;border-radius:50px;border:1px solid #f5dcb5;color:#fff7e9;background:#ffffff15;padding:10px 17px; font-size:13px;font-weight:700;}
    button:focus-visible,.viewer:focus-visible{outline:3px solid #ffe0a1;outline-offset:4px}
    button:disabled{opacity:.28;cursor:default}
    .next {color:#a20026;background:#fff7e7;flex:1;border-color:#fff7e7;letter-spacing:.01em}
    .step{font-size:12px;font-variant-numeric:tabular-nums;min-width:42px;text-align:center;color:#ffe4ba}
    .dots {display:flex;justify-content:center;gap:8px;min-height:8px;align-items:center}
    .dot {height:5px;width:5px;border-radius:50%;background:#ffffff62;transition:width .3s,background .3s}
    .dot.current{width:24px;border-radius:6px;background:#f5d19c}
    .footer {font-size:10px;text-transform:uppercase;letter-spacing:.12em;text-align:center;color:#ffe0c1b3}
    .error {display:none;position:absolute;z-index:20;inset:0;place-items:center;text-align:center;padding:25px;background:#fffaf0;color:#9b0025;font-weight:700;line-height:1.5}
    .error.show{display:grid}
    @media(hover:hover){button:not(:disabled):hover{filter:brightness(1.09)} .viewer{cursor:pointer}}
    @media(max-height:600px){.app{gap:7px}.viewer{width:min(calc(100vw - 24px),calc((100dvh - 135px)*.5625),475px)}.topbar{font-size:10px}.controls button{min-height:37px;padding:7px 12px}}
    @media(prefers-reduced-motion:reduce){.flap.moving{animation-duration:80ms!important;animation-delay:0ms!important}.flap.moving::after{animation:none!important}}
  </style>
</head>
<body>
 <main class="app">
   <header class="topbar"><span class="tag">Eva &amp; Mariano</span><span>31 · 12 · 2026</span></header>
   <div class="viewer" id="viewer" tabindex="0" role="group" aria-label="Invito interattivo: tocca per aprire il prossimo lembo">
      <div class="sheet" id="sheet" style="background-image:url('assets/01-copertina.svg')"></div>
      <div class="seam" aria-hidden="true"></div>
      <div class="layer" id="layer" aria-hidden="true"></div>
      <div class="error" id="error">Immagini non ancora caricate.<br>Carica i cinque file nella cartella <code>origami/assets</code>.</div>
   </div>
   <nav class="controls" aria-label="Sfoglia l'invito"><button id="back" disabled aria-label="Pagina precedente">← Indietro</button><span class="step" id="step" aria-live="polite">1 / 5</span><button class="next" id="next">Apri i lembi →</button></nav>
   <div class="dots" id="dots" aria-hidden="true"></div>
   <div class="footer">Bozza per la famiglia · Orari da confermare</div>
 </main>
 <script>
  (()=>{
   const images=['01-copertina.svg','02-matrimonio.svg','03-compleanno.svg','04-capodanno.svg','05-programma.svg'].map(x=>'assets/'+x);
   const sheet=document.getElementById('sheet'), viewer=document.getElementById('viewer'), layer=document.getElementById('layer'), back=document.getElementById('back'),next=document.getElementById('next'),step=document.getElementById('step'),dots=document.getElementById('dots'),error=document.getElementById('error');
   const modes=['gate','half','petal','strip']; let current=0, busy=false, xStart=null; const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
   function url(src){return `url("${src}")`}
   images.forEach((src,i)=>{const img=new Image();img.onerror=()=>{if(i===current){error.classList.add('show')}};img.onload=()=>{if(i===current)error.classList.remove('show')};img.src=src});
   dots.innerHTML=images.map((_,i)=>`<span class="dot${i===0?' current':''}"></span>`).join('');
   function update(){step.textContent=(current+1)+' / '+images.length;back.disabled=current===0;next.disabled=false;next.textContent=current===images.length-1?'Ricomincia ↻':'Apri i lembi →';[...dots.children].forEach((el,i)=>el.classList.toggle('current',i===current));viewer.setAttribute('aria-label','Pagina '+(current+1)+' di '+images.length+', tocca per aprire');}
   function flap(cls,img,index){const e=document.createElement('div');e.className='flap '+cls;e.style.backgroundImage=url(img);if(index!==undefined)e.style.setProperty('--n',index);layer.append(e)}
   function begin(target){if(busy||target<0||target>=images.length||target===current)return;busy=true;back.disabled=next.disabled=true;
    const mode = modes[Math.min(current,target,modes.length-1)]; const old=images[current];layer.replaceChildren();
    if(mode==='gate'){flap('gate-left',old);flap('gate-right',old)}
    else if(mode==='half'){flap('fold-top',old);flap('fold-bottom',old)}
    else if(mode==='petal'){['top','right','bottom','left'].forEach(x=>flap('petal petal-'+x,old))}
    else{for(let i=0;i<4;i++)flap('strip',old,i)}
    sheet.style.backgroundImage=url(images[target]);viewer.classList.add('is-animating');
    requestAnimationFrame(()=>requestAnimationFrame(()=>[...layer.children].forEach(x=>x.classList.add('moving'))));
    setTimeout(()=>{layer.replaceChildren();current=target;busy=false;viewer.classList.remove('is-animating');update()},reduce?130:1500);
   }
   next.addEventListener('click',()=>begin(current===images.length-1?0:current+1));back.addEventListener('click',()=>begin(current-1));viewer.addEventListener('click',()=>begin(current===images.length-1?0:current+1));
   viewer.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();begin(current===images.length-1?0:current+1)}});
   window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')begin(current===images.length-1?0:current+1);else if(e.key==='ArrowLeft')begin(current-1)});
   viewer.addEventListener('touchstart',e=>{xStart=e.changedTouches[0].clientX},{passive:true});viewer.addEventListener('touchend',e=>{if(xStart===null)return;const dx=e.changedTouches[0].clientX-xStart;xStart=null;if(Math.abs(dx)>55)begin(dx<0?(current===images.length-1?0:current+1):current-1)},{passive:true});
   update();
  })();
 </script>
</body></html>
