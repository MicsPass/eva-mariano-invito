<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b90025">
<meta name="description" content="Eva & Mariano: un matrimonio, un compleanno, un nuovo anno. Tre motivi. Una sola notte.">
<meta property="og:type" content="website">
<meta property="og:title" content="Eva & Mariano · Tre motivi. Una sola notte.">
<meta property="og:description" content="31 dicembre 2026 · Apri l'invito interattivo.">
<meta property="og:image" content="https://micspass.github.io/eva-mariano-invito/origami/assets/01-copertina.svg">
<title>Eva & Mariano — Origami di carta</title>
<style>
:root{color-scheme:light;--wine:#b90025;--gold:#d08b43;--ivory:#fff8ec;--ink:#36191d}
*,*::before,*::after{box-sizing:border-box}
html{background:#9c001d}
body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#fff6e9;background:radial-gradient(ellipse 65% 60% at 50% 42%,#c92545 0%,#b40128 55%,#89001d 100%);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background:repeating-linear-gradient(28deg,#fff1 0px,transparent 1px,transparent 5px);mix-blend-mode:soft-light}
.app{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 12px max(11px,env(safe-area-inset-bottom));gap:10px}
.topbar{width:min(calc(100vw - 26px),470px);display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#ffeed8;min-height:26px}
.topbar strong{font-size:11px;display:inline-flex;align-items:center;gap:8px;letter-spacing:.13em}
.topbar strong::before{content:"";width:6px;height:6px;border-radius:50%;background:#eab26b}
.paper-scene{width:min(calc(100vw - 28px),calc((100dvh - 159px)*.5625),470px);min-width:160px;aspect-ratio:9/16;position:relative;perspective:1600px;transform-style:preserve-3d;touch-action:pan-y;outline-offset:6px;isolation:isolate}
.paper-shadow{position:absolute;inset:1.8% -5% -3%;z-index:0;pointer-events:none;border-radius:45%;background:#36000f7c;filter:blur(20px);transform:translateY(15px) scale(.95);transition:transform 420ms ease,opacity 420ms ease}
.sheet{position:absolute;inset:0;z-index:1;background:#fff center/100% 100% no-repeat;transform-style:preserve-3d;box-shadow:0 0 0 1px #fff7e64d,0 1px 0 #e8d8c4,0 3px 0 -1px #b6987d,0 14px 42px #4a00148c;will-change:transform}
.sheet::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 1px 1px 1px #fff8,inset -1px -1px 1px #34110825}
.fold-cast{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;background:linear-gradient(95deg,#24000a66 0%,transparent 54%,#30110b40 100%)}
.fold-layer{position:absolute;inset:0;z-index:4;transform-style:preserve-3d;pointer-events:none}
.flap{position:absolute;transform-style:preserve-3d;will-change:transform;transform:translateZ(1px)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d}
.front{background-repeat:no-repeat;background-color:#fff;background-position:center;background-size:100% 100%;transform:translateZ(1px)}
.front::after{content:"";position:absolute;inset:0;opacity:.10;pointer-events:none;background:linear-gradient(108deg,#31000775 0%,#0000 37%,#fff9 67%,#3e091242 100%)}
.back{background:repeating-linear-gradient(125deg,#f8f0e6 0px,#f8f0e6 3px,#f6ebdf 4px,#f9f1e7 7px);border:1px solid #dfcdb7;box-shadow:inset 0 0 38px #6a301318,inset 0 0 0 4px #fff9e7;}
.back::after{content:"";position:absolute;inset:3%;border:1px solid #b7814c4d;opacity:.55}
.crease{position:absolute;z-index:2;pointer-events:none;background:linear-gradient(to right,#33100775,#fffaf49a,#651b283d);opacity:.65}
.flap.y .back{transform:rotateY(180deg) translateZ(.4px)}
.flap.x .back{transform:rotateX(180deg) translateZ(.4px)}
.flap.y .crease{top:0;bottom:0;width:3px}
.flap.x .crease{left:0;right:0;height:3px;background:linear-gradient(to bottom,#33100775,#fffaf49a,#651b283d)}
.flap.gate-left,.flap.gate-right{width:50%;height:100%;top:0}
.flap.gate-left{left:0;transform-origin:left center}
.flap.gate-right{right:0;transform-origin:right center}
.gate-left .front,.gate-right .front{background-size:200% 100%}
.gate-left .front{background-position:left top}
.gate-right .front{background-position:right top}
.gate-left .crease{left:0}.gate-right .crease{right:0}
.flap.fold-top,.flap.fold-bottom{left:0;width:100%;height:50%}
.flap.fold-top{top:0;transform-origin:center top}
.flap.fold-bottom{bottom:0;transform-origin:center bottom}
.fold-top .front,.fold-bottom .front{background-size:100% 200%}
.fold-top .front{background-position:left top}
.fold-bottom .front{background-position:left bottom}
.fold-top .crease{top:0}.fold-bottom .crease{bottom:0}
.flap.petal{inset:0}
.petal-top,.petal-bottom{transform-origin:center top}
.petal-bottom{transform-origin:center bottom}
.petal-left{transform-origin:left center}.petal-right{transform-origin:right center}
.petal-top .face{clip-path:polygon(0 0,100% 0,50% 50%)}
.petal-right .face{clip-path:polygon(100% 0,100% 100%,50% 50%)}
.petal-bottom .face{clip-path:polygon(0 100%,100% 100%,50% 50%)}
.petal-left .face{clip-path:polygon(0 0,0 100%,50% 50%)}
.petal-top .crease{top:0}.petal-bottom .crease{bottom:0}
.petal-left .crease{left:0}.petal-right .crease{right:0}
.flap.strip{height:100%;width:25%;top:0}
.strip .front{background-size:400% 100%}
.strip:nth-child(1){left:0;transform-origin:left center}.strip:nth-child(1) .front{background-position:0% 0%}
.strip:nth-child(2){left:25%;transform-origin:right center}.strip:nth-child(2) .front{background-position:33.3333% 0%}
.strip:nth-child(3){left:50%;transform-origin:left center}.strip:nth-child(3) .front{background-position:66.6667% 0%}
.strip:nth-child(4){left:75%;transform-origin:right center}.strip:nth-child(4) .front{background-position:100% 0%}
.strip:nth-child(odd) .crease{left:0}.strip:nth-child(even) .crease{right:0}
.paper-grain{position:absolute;inset:0;z-index:6;pointer-events:none;opacity:.06;background-image:repeating-linear-gradient(0deg,#6b3732 0px,transparent 1px,transparent 4px);mix-blend-mode:multiply}
.controls{width:min(calc(100vw - 26px),470px);display:flex;align-items:center;gap:9px}
button{cursor:pointer;border-radius:999px;min-height:46px;padding:9px 16px;border:1px solid #ffd9a0;color:#fff9eb;background:#fff2;font-size:13px;font-weight:750;letter-spacing:.01em;transition:background 180ms}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,.paper-scene:focus-visible{outline:3px solid #ffde98;outline-offset:4px}
.next{flex:1;background:#fff6e6;color:#9b0022;border-color:#fff6e6}
.step{font-size:12px;color:#fff0d8;font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
.indicator{display:flex;gap:7px;align-items:center;justify-content:center;min-height:9px}
.indicator span{width:5px;height:5px;border-radius:6px;background:#ffffff68;transition:width .35s,background .35s}
.indicator span.on{width:26px;background:#f3c990}
.hint{font-size:10px;color:#ffe3c8cc;text-transform:uppercase;letter-spacing:.11em;text-align:center;line-height:1.5}
.error{position:absolute;inset:0;z-index:20;background:var(--ivory);color:#9b0030;padding:22px;display:none;place-items:center;text-align:center;font-size:15px;font-weight:700}
.error.show{display:grid}
.paper-scene.working .paper-shadow{transform:translateY(21px) scale(1.07);opacity:.94}
@media(hover:hover){button:not(:disabled):hover{background:#fff3}.next:hover{background:#fff} .paper-scene{cursor:pointer}}
@media(max-height:610px){.app{gap:7px;padding-top:5px}.paper-scene{width:min(calc(100vw - 26px),calc((100dvh - 135px)*.5625),470px)}.controls button{min-height:38px;padding:7px 12px}.hint{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:0ms!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><strong>Eva &amp; Mariano</strong><span>31 · 12 · 2026</span></header>
<div class="paper-scene" id="scene" tabindex="0" role="group" aria-label="Invito interattivo: tocca per aprire la carta">
  <div class="paper-shadow" aria-hidden="true"></div>
  <div class="sheet" id="sheet" style="background-image:url('assets/01-copertina.svg')"></div>
  <div class="fold-cast" id="cast" aria-hidden="true"></div>
  <div class="fold-layer" id="layer" aria-hidden="true"></div>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="error" id="error">Le immagini non sono disponibili. Ricarica la pagina.</div>
</div>
<nav class="controls" aria-label="Navigazione dell'invito"><button id="back" disabled>← Indietro</button><span class="step" id="step" aria-live="polite">1 / 5</span><button class="next" id="next">Apri la carta →</button></nav>
<div class="indicator" id="indicator" aria-hidden="true"></div>
<div class="hint">Tocca l'invito per far aprire i lembi · Bozza, orari da confermare</div>
</main>
<script>
(()=>{
  'use strict';
  const names=['01-copertina.svg','02-matrimonio.svg','03-compleanno.svg','04-capodanno.svg','05-programma.svg'];
  const images=names.map(n=>'assets/'+n);
  const $=id=>document.getElementById(id);
  const scene=$('scene'),sheet=$('sheet'),cast=$('cast'),layer=$('layer'),back=$('back'),next=$('next'),step=$('step'),indicator=$('indicator'),error=$('error');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const modes=['gate','horizontal','petals','accordion'];
  let page=0,busy=false,touchX=null,touchY=null;
  const loaded=new Set();
  images.forEach((url,i)=>{const im=new Image();im.onload=()=>{loaded.add(i);if(i===page)error.classList.remove('show')};im.onerror=()=>{if(i===page)error.classList.add('show')};im.src=url;});
  indicator.innerHTML=images.map((_,i)=>`<span class="${i===0?'on':''}"></span>`).join('');
  const bg=url=>`url("${url}")`;
  function refresh(){step.textContent=`${page+1} / ${images.length}`;back.disabled=page===0;next.disabled=false;next.textContent=page===images.length-1?'Ricomincia ↻':'Apri la carta →';scene.setAttribute('aria-label',`Schermata ${page+1} di ${images.length}. Tocca per aprire la carta.`);[...indicator.children].forEach((n,i)=>n.classList.toggle('on',i===page));error.classList.toggle('show',!loaded.has(page));}
  function makeFlap(label,image){
    const el=document.createElement('div');el.className=`flap ${label} ${/fold-top|fold-bottom|petal-top|petal-bottom/.test(label)?'x':'y'}`;
    const front=document.createElement('div');front.className='face front';front.style.backgroundImage=bg(image);
    const backface=document.createElement('div');backface.className='face back';
    const edge=document.createElement('div');edge.className='crease';
    el.append(front,backface,edge);layer.append(el);return el;
  }
  function panels(mode,image){
    if(mode==='gate')return [makeFlap('gate-left',image),makeFlap('gate-right',image)];
    if(mode==='horizontal')return [makeFlap('fold-top',image),makeFlap('fold-bottom',image)];
    if(mode==='petals')return ['petal-top','petal-right','petal-bottom','petal-left'].map(s=>makeFlap('petal '+s,image));
    return Array.from({length:4},()=>makeFlap('strip',image));
  }
  function angleFor(mode,index){
    if(mode==='gate')return index===0? -104:104;
    if(mode==='horizontal')return index===0?104:-104;
    if(mode==='petals')return [105,104,-105,-104][index];
    return [100,-105,105,-105][index];
  }
  function axisFor(mode,index){return mode==='horizontal'||mode==='petals'&&(index===0||index===2)?'X':'Y';}
  function fold(panel,mode,index,direction){
    const a=angleFor(mode,index),axis=axisFor(mode,index);
    const angle=v=>`rotate${axis}(${(a*v).toFixed(1)}deg) translateZ(${v>0?Math.round(Math.sin(Math.min(1,v)*Math.PI)*9):0}px)`;
    let delay=0;
    if(mode==='gate')delay=index===0?0:145;
    else if(mode==='horizontal')delay=index===0?0:160;
    else if(mode==='petals')delay=[60,0,225,115][index];
    else delay=index*105;
    if(direction<0)delay=mode==='accordion'?(3-index)*100:Math.max(0,220-delay);
    const duration=mode==='petals'?1420:mode==='accordion'?1190:1260;
    const frames=[
      {offset:0,transform:angle(0),opacity:1},
      {offset:.09,transform:angle(-.028),opacity:1},
      {offset:.24,transform:angle(.12),opacity:1},
      {offset:.51,transform:angle(.51),opacity:1},
      {offset:.77,transform:angle(.82),opacity:1},
      {offset:.94,transform:angle(1),opacity:1},
      {offset:1,transform:angle(1.04),opacity:0}
    ];
    const movement=panel.animate(frames,{duration,delay,fill:'forwards',easing:'cubic-bezier(.38,.02,.14,1)'});
    panel.querySelector('.front').animate([{opacity:1,filter:'brightness(1)'},{opacity:1,filter:'brightness(.77)',offset:.52},{opacity:1,filter:'brightness(.92)',offset:1}],{duration,delay,fill:'forwards',easing:'ease-in-out'});
    return movement.finished.catch(()=>{});
  }
  async function go(to){
    if(busy||to<0||to>=images.length||to===page)return;
    busy=true;next.disabled=back.disabled=true;scene.classList.add('working');
    if(reduced){page=to;sheet.style.backgroundImage=bg(images[to]);busy=false;scene.classList.remove('working');refresh();return;}
    const mode=modes[Math.min(page,to,modes.length-1)];
    const flaps=panels(mode,images[page]);
    sheet.style.backgroundImage=bg(images[to]);
    // The artwork beneath the folds stays unchanged; only the paper geometry moves.
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    const direction=to>page?1:-1;
    const promises=flaps.map((p,i)=>fold(p,mode,i,direction));
    const total=mode==='petals'?1740:mode==='accordion'?1600:1550;
    sheet.animate([
      {offset:0,transform:'translateZ(-20px) scale(.983) rotateZ(-.45deg)'},
      {offset:.66,transform:'translateZ(-8px) scale(.992) rotateZ(.12deg)'},
      {offset:.88,transform:'translateZ(2px) scale(1.001)'},
      {offset:1,transform:'translateZ(0) scale(1)'}
    ],{duration:total,fill:'none',easing:'cubic-bezier(.27,.02,.2,1)'});
    cast.animate([{offset:0,opacity:.02},{offset:.38,opacity:.36},{offset:.75,opacity:.14},{offset:1,opacity:0}],{duration:total,fill:'none',easing:'ease-in-out'});
    try{await Promise.all(promises);}finally{
      layer.replaceChildren();page=to;busy=false;scene.classList.remove('working');refresh();
    }
  }
  function forward(){go(page===images.length-1?0:page+1)}
  next.addEventListener('click',forward);back.addEventListener('click',()=>go(page-1));scene.addEventListener('click',forward);
  scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();forward()}});
  window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')forward();if(e.key==='ArrowLeft')go(page-1)});
  scene.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});
  scene.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;touchX=touchY=null;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.25)go(dx<0?(page===images.length-1?0:page+1):page-1)},{passive:true});
  refresh();
})();
</script>
</body>
</html>
