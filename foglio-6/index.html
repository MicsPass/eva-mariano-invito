<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9002a">
<meta name="description" content="Eva e Mariano · Un matrimonio, un compleanno, un nuovo anno. Tre motivi. Una sola notte.">
<meta property="og:type" content="website">
<meta property="og:title" content="Eva e Mariano · Tre motivi. Una sola notte.">
<meta property="og:description" content="31 dicembre 2026 — Tocca per aprire il nostro invito, un foglio piegato in sei.">
<meta property="og:image" content="https://micspass.github.io/eva-mariano-invito/foglio-6/anteprima.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<title>Eva e Mariano · Un foglio piegato in sei</title>
<style>
:root{color-scheme:light;--red:#b9002a;--gold:#d18c42;--cream:#fff7eb;--ease:cubic-bezier(.18,.75,.12,1);--fold-ms:1950ms;--camera-ms:2050ms}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 32%,#d32646 0%,#a9002b 62%,#650017 100%);overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,.viewport:focus-visible{outline:3px solid #f6d28c;outline-offset:3px}
.app{height:100vh;height:100dvh;position:relative;isolation:isolate;overflow:hidden}
.viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;perspective:2100px;perspective-origin:50% 48%}
.viewport::before{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(circle at 48% 48%,transparent 26%,#25000e33 100%)}
.world{position:absolute;top:0;left:0;width:600px;height:1600px;transform-origin:0 0;transform-style:preserve-3d;transition:transform var(--camera-ms) var(--ease);will-change:transform}
.paper{width:300px;height:533.333333px;position:absolute;top:0;left:0;transform-style:preserve-3d;backface-visibility:hidden;background:#fffaf1;box-shadow:inset 0 0 0 1px #fff5,0 0 2px #4e001a24}
.paper img{width:100%;height:100%;display:block;object-fit:fill;pointer-events:none;-webkit-user-drag:none}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 .6px #34000b1c; background:linear-gradient(90deg,#14001411,transparent 2.4%,transparent 96%,#14001410);mix-blend-mode:multiply}
.cover{z-index:15;box-shadow:0 0 1px #36000c30,0 8px 24px #34000b40}
.hinge{position:absolute;transform-style:preserve-3d;will-change:transform;transition:transform var(--fold-ms) var(--ease),filter var(--fold-ms) ease,opacity .42s ease;backface-visibility:visible;opacity:0;pointer-events:none}
.hinge.open{opacity:1;pointer-events:auto}
.hinge::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.72;background:linear-gradient(90deg,#16000c22 0%,transparent 13%,transparent 90%,#16000c0d 100%);transition:opacity 1400ms ease}
.hinge.open::after{opacity:.10}
.hinge .underside{position:absolute;inset:0;background:repeating-linear-gradient(95deg,#f4ebdc 0 6px,#efe0cf 6px 7px);box-shadow:inset 0 0 29px #6f3a322e,0 7px 18px #47001248;backface-visibility:hidden;pointer-events:none}
.hinge.right .underside{transform:rotateY(180deg)}
.hinge.down .underside{transform:rotateX(180deg)}
.hinge.right{width:300px;height:533.333333px;transform-origin:0 50%;transform:rotateY(-179.8deg)}
.hinge.right.open{transform:rotateY(0)}
.hinge.down{width:600px;transform-origin:50% 0;transform:rotateX(179.8deg)}
.hinge.down.open{transform:rotateX(0)}
#fold-2{left:300px;top:0;z-index:11}
#fold-3{left:0;top:533.333333px;height:1066.666667px;z-index:10}
#fold-4{left:300px;top:0;z-index:9}
#fold-5{left:0;top:533.333333px;height:533.333333px;z-index:8}
#fold-6{left:300px;top:0;z-index:7}
#fold-2.open,#fold-4.open,#fold-6.open{filter:drop-shadow(2px 0 4px #2b00122e)}
#fold-3.open,#fold-5.open{filter:drop-shadow(0 2px 3px #34000b23)}
#fold-3>.paper,#fold-5>.paper{z-index:12}
#fold-3>.paper::before,#fold-5>.paper::before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(#0002,transparent 4%,transparent 96%,#0001)}
#fold-2 .paper,#fold-4 .paper,#fold-6 .paper{z-index:12}
#fold-2 .paper::before,#fold-4 .paper::before,#fold-6 .paper::before{content:"";position:absolute;z-index:1;inset:0;pointer-events:none;background:linear-gradient(90deg,#0002,transparent 4%,transparent 96%,#0001)}
/* A discreet light-and-shadow crease remains once the sheet is flat. */
.fold-seam{position:absolute;pointer-events:none;z-index:20;opacity:.0;transition:opacity .7s ease}
.fold-seam.vertical{left:298.5px;top:0;height:1600px;width:3px;background:linear-gradient(90deg,#31001531,#fff8 56%,transparent);}
.fold-seam.horizontal.one{top:531.5px;left:0;height:3px;width:600px;background:linear-gradient(#31001525,#fffa 60%,transparent)}
.fold-seam.horizontal.two{top:1065px;left:0;height:3px;width:600px;background:linear-gradient(#31001525,#fffa 60%,transparent)}
.world[data-stage="6"] .fold-seam,.world[data-stage="5"] .fold-seam.one{opacity:.45}
.sheet-shadow{position:absolute;z-index:-1;left:0;top:0;width:300px;height:533.333333px;background:#31000e;filter:blur(35px);opacity:.54;transform:translate(7px,12px);pointer-events:none;transition:width var(--camera-ms),height var(--camera-ms)}
.hud{position:absolute;z-index:50;top:max(11px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
.brand,.counter{display:inline-flex;align-items:center;gap:9px;min-height:34px;padding:7px 12px;border-radius:24px;color:#fffaf0;background:#3f0019a6;border:1px solid #fce7c14e;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand{font-family:Georgia,serif;font-style:italic;font-size:17px}.brand b{color:#efb963;font-weight:400}.counter{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.orb{position:absolute;z-index:55;left:50%;top:50%;width:62px;height:62px;border:1.5px solid #fff9ecae;border-radius:50%;background:#ae163b77;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 22px #30001655,0 0 0 6px #fff3e81d;display:grid;place-items:center;color:#fffef7;transform:translate(-50%,-50%);transition:left var(--camera-ms) var(--ease),top var(--camera-ms) var(--ease),opacity .4s ease;animation:breathe 2.2s ease-in-out infinite;}
.orb svg{width:29px;height:29px;stroke:#fff9ee;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.orb[hidden]{display:none}
.orb:after{content:"";position:absolute;inset:-8px;border:1px solid #ffe7bb88;border-radius:50%;animation:ripple 2.2s ease-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 4px 22px #30001655,0 0 0 4px #fff3e820;transform:translate(-50%,-50%) scale(1)}50%{box-shadow:0 8px 32px #30001666,0 0 0 10px #fff3e82b;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes ripple{0%{opacity:.75;transform:scale(.72)}75%,100%{opacity:0;transform:scale(1.45)}}
.bottom-hud{position:absolute;z-index:60;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding:0 14px}
.guidance{max-width:min(94vw,430px);text-align:center;padding:8px 13px;background:#350016a1;border:1px solid #ffecc441;border-radius:24px;font-size:12px;line-height:1.25;color:#fff0d8;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.actions{display:flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto;flex-wrap:wrap}
.action{min-height:40px;padding:9px 14px;border:1px solid #fbe5c483;color:#fff9ee;border-radius:25px;background:#470017c4;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);font-weight:700;font-size:12px}
.action.primary{background:#fff8ec;color:#9c082d;border-color:#fff8ec}
.action.square{min-width:39px;padding:9px 11px;font-size:19px;line-height:1}
.action:disabled{opacity:.38;cursor:default}.action[hidden]{display:none}
.tap-panels{cursor:zoom-in}
[aria-live]{pointer-events:none}
@media(min-width:680px){.hud{top:17px;left:23px;right:23px}.brand{font-size:22px}.orb{width:70px;height:70px}.guidance{font-size:13px}.action{font-size:13px}}
@media(max-height:580px){.guidance{display:none}.bottom-hud{bottom:6px}.action{min-height:35px;padding:7px 11px}.orb{width:49px;height:49px}}
@media(prefers-reduced-motion:reduce){:root{--fold-ms:30ms;--camera-ms:30ms}.orb,.orb::after{animation:none}}
</style>
</head>
<body>
<main class="app">
<section id="viewport" class="viewport" aria-label="Invito di Eva e Mariano: un foglio piegato in sei, interattivo" tabindex="0">
 <div class="world" id="world" data-stage="1">
  <div class="sheet-shadow" id="shadow"></div>
  <div class="hinge right" id="fold-2" data-index="1"><div class="underside"></div><div class="paper"><img src="assets/02-matrimonio.svg" alt="Matrimonio: tredici anni e finalmente la festa" draggable="false"></div></div>
  <div class="hinge down" id="fold-3">
   <div class="underside"></div>
   <div class="paper" data-index="2"><img src="assets/03-compleanno.svg" alt="Compleanno: Eva compie cinquant'anni" draggable="false"></div>
   <div class="hinge right" id="fold-4" data-index="3"><div class="underside"></div><div class="paper"><img src="assets/04-capodanno.svg" alt="Capodanno: aspettiamo insieme il 2027" draggable="false"></div></div>
   <div class="hinge down" id="fold-5">
    <div class="underside"></div>
    <div class="paper" data-index="4"><img src="assets/05-programma.svg" alt="Programma completo della serata" draggable="false"></div>
    <div class="hinge right" id="fold-6" data-index="5"><div class="underside"></div><div class="paper"><img src="assets/06-finale.svg" alt="Eva e Mariano, foto finale" draggable="false"></div></div>
   </div>
  </div>
  <div class="paper cover" data-index="0"><img src="assets/01-cover.svg" alt="Eva e Mariano, tre motivi una sola notte" draggable="false"></div>
  <div class="fold-seam vertical" aria-hidden="true"></div><div class="fold-seam horizontal one" aria-hidden="true"></div><div class="fold-seam horizontal two" aria-hidden="true"></div>
 </div>
</section>
<div class="hud"><span class="brand">Eva <b>&amp;</b> Mariano</span><span class="counter" id="counter" aria-live="polite">1 / 6 · foglio piegato</span></div>
<button type="button" class="orb" id="orb" aria-label="Apri il prossimo lembo"><svg viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
<div class="bottom-hud">
 <div class="guidance" id="guidance" aria-live="polite">Tocca il cerchio per aprire il primo lembo</div>
 <div class="actions">
  <button class="action" id="back" hidden type="button">← Indietro</button>
  <button class="action primary" id="overview" hidden type="button">↙ Vista completa</button>
  <button class="action square" id="minus" hidden type="button" aria-label="Riduci zoom">−</button>
  <button class="action square" id="plus" hidden type="button" aria-label="Aumenta zoom">+</button>
  <button class="action" id="restart" hidden type="button">Ricomincia ↺</button>
 </div>
</div>
</main>
<script>
(()=>{
'use strict';
const W=300,H=1600/3, minScale=1,maxZoom=3.2;
const viewport=document.getElementById('viewport'),world=document.getElementById('world'),orb=document.getElementById('orb'),back=document.getElementById('back'),overview=document.getElementById('overview'),restart=document.getElementById('restart'),minus=document.getElementById('minus'),plus=document.getElementById('plus'),guidance=document.getElementById('guidance'),counter=document.getElementById('counter'),shadow=document.getElementById('shadow');
const folds=[null,document.getElementById('fold-2'),document.getElementById('fold-3'),document.getElementById('fold-4'),document.getElementById('fold-5'),document.getElementById('fold-6')];
const names=['Copertina','Matrimonio','Compleanno','Capodanno','Programma','Finale'];
const origins=[{x:0,y:0},{x:W,y:0},{x:0,y:H},{x:W,y:H},{x:0,y:H*2},{x:W,y:H*2}];
const pulseAnchors=[{x:W*.78,y:H*.52},{x:W*1.80,y:H*.50},{x:W*.76,y:H*1.49},{x:W*1.80,y:H*1.48},{x:W*.77,y:H*2.49}];
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let stage=1,focused=-1,zoom=1,panX=0,panY=0,busy=false,lastTransform=null,blockClick=false;
const pointers=new Map();let gesture=null;
function bounds(){if(focused>=0)return {x:origins[focused].x,y:origins[focused].y,w:W,h:H};return {x:0,y:0,w:stage===1?W:W*2,h:stage<3?H:stage<5?H*2:H*3};}
function camera(){const b=bounds(), margin=focused<0&&stage===1?6:stage===6?23:16;
 const availW=Math.max(160,viewport.clientWidth-margin*2),availH=Math.max(200,viewport.clientHeight-margin*2);
 const fit=Math.min(availW/b.w,availH/b.h);
 return {s:fit*zoom,cx:b.x+b.w/2,cy:b.y+b.h/2};}
function fitPoint(p){const {s,cx,cy}=camera();return {x:viewport.clientWidth/2+(p.x-cx)*s+panX,y:viewport.clientHeight/2+(p.y-cy)*s+panY};}
function render(instant=false){const {s,cx,cy}=camera(),left=viewport.clientWidth/2-cx*s+panX,top=viewport.clientHeight/2-cy*s+panY;
 world.style.transitionDuration=instant?'0ms':focused>=0?'900ms':reduced?'30ms':'2050ms';
 world.style.transform=`translate(${left.toFixed(2)}px,${top.toFixed(2)}px) scale(${s.toFixed(6)})`;
 world.dataset.stage=String(stage); shadow.style.width=`${stage===1?300:600}px`;shadow.style.height=`${stage<3?H:stage<5?H*2:H*3}px`;
 if(stage<6&&focused===-1){orb.hidden=false;const o=fitPoint(pulseAnchors[stage-1]);orb.style.left=`${Math.max(38,Math.min(viewport.clientWidth-38,o.x))}px`;orb.style.top=`${Math.max(60,Math.min(viewport.clientHeight-75,o.y))}px`;}else orb.hidden=true;
 back.hidden=stage===1||focused>=0;overview.hidden=focused<0;restart.hidden=stage<6;plus.hidden=minus.hidden=focused<0;
 counter.textContent=focused>=0?`${focused+1} / 6 · ${names[focused]}`:`${stage} / 6 · ${stage===6?'foglio aperto':'apertura'}`;
 guidance.textContent=focused>=0?'Pizzica per ingrandire · trascina per esplorare':stage===6?'Tocca una delle sei parti per ingrandirla':stage===1?'Tocca il cerchio per aprire il primo lembo':'Un altro tocco: il foglio continua a dispiegarsi';
 minus.disabled=zoom<=1.02;
}
function setStage(next){if(busy||focused>=0||next<1||next>6||next===stage)return;
 busy=true;orb.disabled=true;stage=next;zoom=1;panX=panY=0;
 folds.forEach((node,i)=>{if(node)node.classList.toggle('open',stage>=i+1)});
 render();setTimeout(()=>{busy=false;orb.disabled=false},reduced?50:2150);
}
function focus(index){if(stage!==6||busy||index<0||index>5)return;focused=index;zoom=1;panX=panY=0;render();}
function showAll(){if(stage!==6)return;focused=-1;zoom=1;panX=panY=0;render()}
function zoomBy(factor){if(focused<0)return;zoom=Math.min(maxZoom,Math.max(minScale,zoom*factor));if(zoom<=1.01){panX=0;panY=0}render()}
function clickNext(){if(focused>=0){showAll();return;}if(stage<6)setStage(stage+1)}
orb.addEventListener('click',e=>{e.stopPropagation();clickNext()});
back.addEventListener('click',()=>setStage(stage-1));overview.addEventListener('click',showAll);restart.addEventListener('click',()=>{if(focused>=0){showAll();return;}stage=6;setStage(1)});
plus.addEventListener('click',()=>zoomBy(1.36));minus.addEventListener('click',()=>zoomBy(1/1.36));
viewport.addEventListener('click',e=>{if(blockClick){blockClick=false;return;}if(busy)return;if(stage<6){clickNext();return;}if(focused>=0)return;
 const element=e.target.closest('[data-index]');if(element)focus(Number(element.dataset.index));});
viewport.addEventListener('dblclick',e=>{e.preventDefault();if(focused>=0)zoomBy(zoom<1.5?1.7:1/1.7)});
viewport.addEventListener('wheel',e=>{if(focused<0)return;e.preventDefault();zoomBy(e.deltaY<0?1.12:1/1.12)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(stage<6||busy||focused<0)return;viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){gesture={kind:'drag',x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false}}
 if(pointers.size===2){const a=[...pointers.values()];gesture={kind:'pinch',distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:zoom,px:panX,py:panY};}
});
viewport.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2&&gesture?.kind==='pinch'&&focused>=0){const a=[...pointers.values()];zoom=Math.max(1,Math.min(maxZoom,gesture.scale*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(gesture.distance,1)));blockClick=true;render(true)}
 else if(pointers.size===1&&gesture?.kind==='drag'&&focused>=0){let dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(Math.hypot(dx,dy)>7)gesture.moved=true;if(gesture.moved){panX=gesture.px+dx;panY=gesture.py+dy;blockClick=true;render(true)}}
});
function end(e){pointers.delete(e.pointerId);if(gesture?.moved||gesture?.kind==='pinch')blockClick=true;if(!pointers.size)gesture=null;else if(pointers.size===1){const a=[...pointers.values()][0];gesture={kind:'drag',x:a.x,y:a.y,px:panX,py:panY,moved:false}}}
viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
viewport.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();clickNext()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&focused>=0)showAll();else if(e.key==='ArrowRight'&&focused>=0)focus(Math.min(5,focused+1));else if(e.key==='ArrowLeft'&&focused>=0)focus(Math.max(0,focused-1));});
window.addEventListener('resize',()=>render(true));
requestAnimationFrame(()=>render(true));
})();
</script>
</body>
</html>
