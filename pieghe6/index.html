<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b70027">
<meta name="description" content="Eva e Mariano: un matrimonio, un compleanno, un nuovo anno. Tre motivi, una sola notte. 31 dicembre 2026.">
<meta property="og:type" content="website">
<meta property="og:title" content="Eva e Mariano · Tre motivi. Una sola notte.">
<meta property="og:description" content="31 dicembre 2026 — Apri la nostra partecipazione piegata in sei.">
<meta property="og:image" content="https://micspass.github.io/eva-mariano-invito/origami/assets/01-copertina.svg">
<title>Eva e Mariano · Un foglio, sei storie</title>
<style>
:root {--red:#b9002a;--wine:#69051d;--gold:#d18c42;--paper:#fffaf1;--ease:cubic-bezier(.22,.72,.15,1);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:radial-gradient(circle at 50% 23%,#d72d49 0,#b00029 44%,#7e0a26 100%);color:white}
button{font:inherit;touch-action:manipulation}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:9px;padding:15px clamp(12px,3vw,32px) max(12px,env(safe-area-inset-bottom));overflow:hidden}
.head{width:min(100%,1100px);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:18px;flex:none}
.brand{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(24px,4.2vw,33px);white-space:nowrap;letter-spacing:-.02em;color:#fff3e1}
.head-right{font-size:11px;letter-spacing:.19em;line-height:1.65;color:#ffe0b2;text-align:right;text-transform:uppercase}
.viewer{position:relative;flex:1;min-height:0;width:100%;margin-inline:auto;overflow:hidden;border-radius:14px;background:radial-gradient(ellipse at center, #b71338 0%,#9b002b 68%,#7d0a25 100%);box-shadow:inset 0 0 0 1px #fff3;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overscroll-behavior:contain}
.viewer:active{cursor:grabbing}
.viewer:before{content:"";pointer-events:none;position:absolute;inset:0;opacity:.20;background:repeating-linear-gradient(112deg,transparent 0 8px,#fff1 9px 10px,transparent 11px 17px);mix-blend-mode:soft-light}
.viewer:after{content:"";pointer-events:none;position:absolute;z-index:12;inset:0;border:1px solid #fff2;border-radius:inherit}
.paper{width:900px;height:1066.6667px;position:absolute;left:50%;top:50%;transform-origin:0 0;transform-style:preserve-3d;will-change:transform;transition:transform 1350ms var(--ease);}
.piece{position:absolute;transform-style:preserve-3d;transition:transform 1300ms var(--ease),filter 1300ms var(--ease);will-change:transform}
.piece .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden}
.piece .face.front{background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.piece .face.back{transform:rotateY(180deg);background:repeating-linear-gradient(0deg,#e7d7b9 0 1px,#f6eddd 1px 6px);box-shadow:inset 0 0 20px #8d6d4c35}
.piece .face.front:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#3d081525,transparent 14%,transparent 80%,#3d081515);opacity:.07;transition:opacity 800ms}
.piece:before{content:"";position:absolute;pointer-events:none;inset:0;z-index:2;box-shadow:0 2px 3px #22000b30}
.side{width:300px;height:533.333px;top:0;z-index:4}
.side.left{left:0;transform-origin:100% 50%;transform:rotateY(-178deg)}
.side.right{left:600px;transform-origin:0 50%;transform:rotateY(178deg)}
.paper.open-sides .side.left,.paper.open-sides .side.right{transform:rotateY(0deg)}
.paper.open-sides .side.left{filter:drop-shadow(-5px 12px 10px #32000944)}
.paper.open-sides .side.right{filter:drop-shadow(5px 12px 10px #32000944)}
.center{width:300px;height:533.333px;left:300px;top:0;z-index:5;box-shadow:0 12px 21px #38061552}
.center .front{background-image:url('assets/01-cover.svg')}
.side.left .front{background-image:url('assets/02-matrimonio.svg')}
.side.right .front{background-image:url('assets/03-compleanno.svg')}
.paper .spine{position:absolute;z-index:8;pointer-events:none;left:300px;top:0;height:533.333px;width:300px;background:linear-gradient(90deg,#0002,transparent 3%,transparent 96%,#0002);opacity:0;transition:opacity 1s}
.paper.open-sides .spine{opacity:.3}
.bottom{position:absolute;left:0;top:533.333px;width:900px;height:533.333px;z-index:1;transform-style:preserve-3d;transform-origin:50% 0%;transform:rotateX(-179deg);transition:transform 1470ms cubic-bezier(.22,.65,.20,1);will-change:transform}
.paper.open-bottom .bottom{transform:rotateX(0deg)}
.bottom .backplane{position:absolute;inset:0;transform:rotateX(180deg);backface-visibility:hidden;background:repeating-linear-gradient(90deg,#eaddcb 0 3px,#f7efe3 3px 8px);box-shadow:inset 0 0 26px #804b4566}
.bottom .bottom-piece{width:300px;height:533.333px;position:absolute;top:0;transform-style:preserve-3d;backface-visibility:hidden;background:var(--paper);box-shadow:inset 0 0 1px #24000f4d}
.bottom-piece img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.bottom-piece[data-panel="3"]{left:0}.bottom-piece[data-panel="4"]{left:300px}.bottom-piece[data-panel="5"]{left:600px}
.bottom .crease{position:absolute;z-index:5;pointer-events:none;inset:0;background:linear-gradient(90deg,transparent 32.8%,#18001424 33.25%,#fff9 33.40%,transparent 34%,transparent 66%,#18001424 66.65%,#fff7 66.80%,transparent 67.4%);opacity:.55}
.paper .lower-seam{position:absolute;left:0;top:532.8px;width:900px;height:2px;z-index:2;background:linear-gradient(#fff9,#21000933);opacity:0}
.paper.open-bottom .lower-seam{opacity:.72}
.paper.zoomed .piece,.paper.zoomed .bottom{transition-duration:0ms}
.tag-corner{position:absolute;z-index:15;top:14px;left:14px;padding:7px 10px;background:#510015b8;border:1px solid #ffddad55;color:#ffe9c9;border-radius:24px;text-transform:uppercase;letter-spacing:.13em;font-size:10px;pointer-events:none}
.hint{position:absolute;z-index:15;bottom:14px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;pointer-events:none;background:#350113c9;border:1px solid #ffe1a555;border-radius:22px;padding:9px 14px;color:#fff7e8;font-size:12px;line-height:1.4;white-space:nowrap}
.tools{flex:none;width:min(100%,950px);margin-inline:auto;display:flex;align-items:center;justify-content:center;gap:8px}
.btn{border:1px solid #ffe4bd85;background:#ffffff1c;color:white;border-radius:28px;min-height:45px;padding:11px 15px;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.32;cursor:default}
.btn:focus-visible,.thumb:focus-visible{outline:3px solid #ffde96;outline-offset:2px}
.btn.main{background:#fff7e9;color:#980323;border-color:#fff7e9;min-width:min(45vw,240px)}
.btn.square{min-width:44px;padding:9px}
.step{font-size:11px;letter-spacing:.1em;color:#ffe8ce;white-space:nowrap}
.thumbs{flex:none;display:none;gap:7px;margin-inline:auto;max-width:100%;padding:3px 0 2px;overflow-x:auto;scrollbar-width:thin;overscroll-behavior-x:contain}
.thumbs.visible{display:flex}
.thumb{flex:0 0 auto;min-width:79px;border:1px solid #edbb9099;background:#4b0d21a1;color:#fff6e9;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.03em}
.thumb.selected{background:#fff7e9;color:#990024}
.foot{flex:none;line-height:1.25;text-align:center;font-size:10px;color:#ffe2c6aa;letter-spacing:.06em}
@media(min-width:700px){.app{gap:10px}.head{margin-top:5px}.viewer{width:min(100%,1250px)}.tools{gap:12px}.thumb{min-width:126px;padding:9px}.thumbs{gap:10px}}
@media(max-height:620px){.app{gap:5px;padding-top:7px}.brand{font-size:21px}.head-right{font-size:9px}.head{min-height:28px}.btn{min-height:37px;padding:7px 11px}.foot{display:none}.thumb{padding:5px 8px}}
@media(prefers-reduced-motion:reduce){.paper,.piece,.bottom{transition-duration:.03ms!important}.viewer *{animation-duration:.03ms!important}}
</style>
</head>
<body>
<main class="app">
<header class="head"><span class="brand">Eva <span style="color:#efc187">&amp;</span> Mariano</span><span class="head-right">31 dicembre 2026<br>tre motivi · una notte</span></header>
<section class="viewer" id="viewer" aria-label="Foglio interattivo piegato in sei pannelli">
  <div class="tag-corner" id="status">01 · foglio chiuso</div>
  <div class="paper" id="paper">
    <div class="bottom" id="bottom">
      <div class="backplane"></div>
      <div class="bottom-piece" data-panel="3"><img src="assets/04-capodanno.svg" alt="Capodanno 2027" draggable="false"></div>
      <div class="bottom-piece" data-panel="4"><img src="assets/05-programma.svg" alt="Programma e luogo" draggable="false"></div>
      <div class="bottom-piece" data-panel="5"><img src="assets/06-finale.svg" alt="Eva e Mariano, foto finale" draggable="false"></div>
      <div class="crease"></div>
    </div>
    <div class="lower-seam"></div>
    <div class="piece side left" data-panel="1"><div class="face front"></div><div class="face back"></div></div>
    <div class="piece side right" data-panel="2"><div class="face front"></div><div class="face back"></div></div>
    <div class="piece center" data-panel="0"><div class="face front"></div><div class="face back"></div></div>
    <div class="spine"></div>
  </div>
  <div class="hint" id="hint">Tocca la copertina per aprire il primo lembo</div>
</section>
<div class="tools">
 <button type="button" id="mainBtn" class="btn main">Apri la prima piega →</button>
 <button type="button" id="overviewBtn" class="btn" hidden>Vista globale</button>
 <button type="button" id="minusBtn" class="btn square" aria-label="Riduci" disabled>−</button>
 <button type="button" id="plusBtn" class="btn square" aria-label="Ingrandisci" disabled>+</button>
 <span id="zoomLabel" class="step">1 / 3</span>
</div>
<nav class="thumbs" id="thumbs" aria-label="Sei pannelli della partecipazione">
 <button class="thumb" data-go="0">01 · Copertina</button><button class="thumb" data-go="1">02 · Matrimonio</button><button class="thumb" data-go="2">03 · Compleanno</button><button class="thumb" data-go="3">04 · Capodanno</button><button class="thumb" data-go="4">05 · Programma</button><button class="thumb" data-go="5">06 · Finale</button>
</nav>
<div class="foot">Prototipo · Un foglio, sei facciate · Tutte le grafiche di Micaela</div>
</main>
<script>
(()=>{
'use strict';
const PW=300,PH=533.333333,labels=['Copertina','Matrimonio','Compleanno','Capodanno','Programma','Finale'];
const viewer=document.getElementById('viewer'), paper=document.getElementById('paper'), main=document.getElementById('mainBtn'), overview=document.getElementById('overviewBtn'), plus=document.getElementById('plusBtn'), minus=document.getElementById('minusBtn'), zoomLabel=document.getElementById('zoomLabel'), status=document.getElementById('status'), hint=document.getElementById('hint'), thumbs=document.getElementById('thumbs');
let phase=0,focused=-1, zoom=1,panX=0,panY=0,busy=false,silentClick=false;const touches=new Map();let dragOrigin=null,pinch=null;const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fit=(w,h)=>Math.min((viewer.clientWidth-34)/w,(viewer.clientHeight-48)/h);
function target(){
 const full=phase===2;
 if(focused>=0){return{cx:(focused%3+.5)*PW,cy:(Math.floor(focused/3)+.5)*PH,scale:fit(PW,PH)*zoom}}
 return{cx:450,cy:full?PH:PH/2,scale:fit(full?PW*3:phase===1?PW*3:PW,full?PH*2:PH)*zoom};
}
function draw(instant=false){const t=target();paper.style.transitionDuration=instant?'0ms':reduced?'30ms':'1350ms';paper.style.transform=`translate(${(-t.cx*t.scale+panX).toFixed(2)}px,${(-t.cy*t.scale+panY).toFixed(2)}px) scale(${t.scale.toFixed(5)})`; status.textContent=focused>=0?`${String(focused+1).padStart(2,'0')} · ${labels[focused]}`:phase===0?'01 · foglio chiuso':phase===1?'02 · prime pieghe aperte':'03 · foglio completamente aperto';hint.textContent=focused>=0?'Trascina per spostarti · pizzica per ingrandire':phase===0?'Tocca la copertina per aprire il primo lembo':phase===1?'Ancora un clic per dispiegare l’intero foglio':'Tocca un pannello per esplorare i dettagli';thumbs.classList.toggle('visible',phase===2);overview.hidden=true;plus.disabled=minus.disabled=phase!==2; main.textContent=focused>=0?'← Vista globale':phase===0?'Apri la prima piega →':phase===1?'Dispiegalo completamente →':'Ripiega il foglio ↶';zoomLabel.textContent=phase<2?`${phase+1} / 3`:`${Math.round(zoom*100)}%`;[...thumbs.children].forEach((b,i)=>b.classList.toggle('selected',i===focused));}
function lock(ms){busy=true;main.disabled=true;window.setTimeout(()=>{busy=false;main.disabled=false},reduced?50:ms)}
function setPhase(n){if(busy||n<0||n>2)return; focused=-1;zoom=1;panX=panY=0;phase=n;paper.classList.toggle('open-sides',phase>=1);paper.classList.toggle('open-bottom',phase>=2);paper.classList.remove('zoomed');draw();lock(phase===2?1530:1330)}
function focus(i){if(phase!==2||busy||i<0||i>5)return;focused=i;zoom=1;panX=panY=0;paper.classList.add('zoomed');draw();}
function global(){if(phase!==2)return;focused=-1;zoom=1;panX=panY=0;paper.classList.remove('zoomed');draw()}
function zoomBy(f){if(phase!==2)return; zoom=Math.max(1,Math.min(3.5,zoom*f));if(zoom===1){panX=panY=0}draw()}
main.addEventListener('click',()=>{if(focused>=0){global();return}setPhase(phase===2?0:phase+1)});
overview.addEventListener('click',global);plus.addEventListener('click',()=>zoomBy(1.35));minus.addEventListener('click',()=>zoomBy(1/1.35));
thumbs.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)focus(Number(b.dataset.go))});
viewer.addEventListener('click',e=>{if(silentClick){silentClick=false;return}if(busy)return;if(phase<2){setPhase(phase+1);return}const el=e.target.closest('[data-panel]');if(el)focus(Number(el.dataset.panel))});
viewer.addEventListener('dblclick',e=>{e.preventDefault();if(phase===2){if(focused>=0)zoomBy(zoom<1.3?1.8:1/1.8);else{const el=e.target.closest('[data-panel]');if(el)focus(Number(el.dataset.panel))}}});
viewer.addEventListener('wheel',e=>{if(phase!==2)return;e.preventDefault();zoomBy(e.deltaY>0?0.90:1.11)},{passive:false});
viewer.addEventListener('pointerdown',e=>{if(phase!==2)return;viewer.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){dragOrigin={x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false}}if(touches.size===2){const a=[...touches.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),startZoom:zoom};dragOrigin=null}});
viewer.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2&&pinch){const a=[...touches.values()];zoom=Math.max(1,Math.min(3.5,pinch.startZoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(pinch.distance,1)));silentClick=true;draw(true)}else if(touches.size===1&&dragOrigin){const dx=e.clientX-dragOrigin.x,dy=e.clientY-dragOrigin.y;if(Math.hypot(dx,dy)>7)dragOrigin.moved=true;if(dragOrigin.moved){panX=dragOrigin.px+dx;panY=dragOrigin.py+dy;silentClick=true;draw(true)}}});
function endPointer(e){if(dragOrigin?.moved)silentClick=true;touches.delete(e.pointerId);if(touches.size<2)pinch=null;if(touches.size===0)dragOrigin=null;}
viewer.addEventListener('pointerup',endPointer);viewer.addEventListener('pointercancel',endPointer);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&focused>=0)global();else if(e.key==='ArrowRight'&&focused>=0)focus(Math.min(5,focused+1));else if(e.key==='ArrowLeft'&&focused>=0)focus(Math.max(0,focused-1));else if(e.key==='Enter'&&document.activeElement===viewer){if(phase<2)setPhase(phase+1)}});
window.addEventListener('resize',()=>draw(true));
// Fit once layout dimensions are known.
requestAnimationFrame(()=>draw(true));
})();
</script>
</body>
</html>
